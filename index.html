<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>After Dark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0} [hidden]{display:none!important} img{max-width:100%}
.coderow code{font-size:14px!important;font-weight:600!important;font-family:var(--body)!important}

/* Layout: compact sticky game header, one card stage, answers as chat bubbles inside the card, sticky bottom bar for Skip / Pause. Single deliberate late-night look. */
:root{
  --bg:#160a11; --bg2:#22101b; --card:#2d1424; --line:#4a2639;
  --ink:#fbefea; --muted:#dcc0c8; --rose:#ff5b7a; --ember:#ffb08a; --ok:#7fd8b0;
  --me:#5a1f39; --them:#3a1a2c;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --ts:1;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:radial-gradient(120% 70% at 50% -10%,var(--glowc) 0%,var(--bg) 60%) fixed,var(--bg);color:var(--ink);font-family:var(--body);font-size:calc(16px*var(--ts));line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-style:italic;font-weight:700;font-size:clamp(40px,11vw,60px);line-height:.95;margin:0;letter-spacing:-.01em}
h1 span,.brand span{color:var(--rose)}
.sub{color:var(--muted);margin:6px 0 0;max-width:46ch}
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.row{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
label,.lbl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
input,select,textarea{width:100%;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit}
textarea{min-height:92px;resize:vertical;line-height:1.45}
textarea:disabled{opacity:.45}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
button{font:inherit;cursor:pointer;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px;font-weight:600}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:linear-gradient(135deg,var(--rose),var(--ember));border:0;color:#200813;padding:13px 20px;font-size:16px}
button.ghost{background:transparent}
.note{font-size:13px;color:var(--muted);margin:0}
.err{font-size:13px;color:var(--ember);margin:0}
.rules{margin:0;padding-left:18px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:4px}
.who{display:flex;flex-direction:column;gap:6px}
.who div{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;border-radius:10px;background:var(--card)}
.who .on{color:var(--ok)}
/* game header */
.ghead{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#160a11d9;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:8px 16px;margin:-8px -16px 0;border-radius:0 0 16px 16px;display:flex;flex-direction:column;gap:8px}
.gtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.gtop .meta{font-size:13px}
.brand{font-family:var(--display);font-style:italic;font-weight:700;font-size:20px}
.heatname{font-family:var(--display);font-style:italic;font-size:20px;color:var(--ember)}
.ladder{display:flex;gap:4px}
.ladder i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.ladder i.lit{background:linear-gradient(90deg,var(--ember),var(--rose))}
.ladder i.cap{opacity:.25}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
/* card */
.card{background:linear-gradient(160deg,var(--card),#1d0c17);border:1px solid var(--line);border-radius:24px;padding:22px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 60px -30px #000}
.card.flip{animation:flip .4s ease}
@keyframes flip{from{transform:rotateY(60deg) scale(.97);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.card.flip{animation:none}}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.kind{display:inline-flex;gap:8px;align-items:center;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;padding:5px 10px;border-radius:999px;background:#ff5b7a22;color:var(--rose)}
.kind.alt{background:#ffb08a22;color:var(--ember)}
.kind.plain{background:transparent;border:1px solid var(--line);color:var(--muted)}
.owner{font-size:13px;color:var(--muted)}
.owner b{color:var(--ink)}
.text{font-family:var(--display);font-weight:600;font-size:calc(clamp(22px,6vw,26px)*var(--ts));line-height:1.35;margin:0;text-wrap:pretty;letter-spacing:-.005em}
.text em{color:var(--rose);font-style:italic}
.banner{font-size:14px;padding:10px 12px;border-radius:12px;background:#ffb08a1c;color:var(--ember)}
.opts{display:grid;gap:8px}
.opts button{text-align:left;border-radius:14px;font-weight:500;padding:12px 14px;font-size:calc(16px*var(--ts))}
.opts button.pick{border-color:var(--rose);background:#ff5b7a2b}
.follow{font-size:calc(18px*var(--ts));font-weight:600;line-height:1.4}
.compose{display:flex;flex-direction:column;gap:8px}
.timer{display:flex;align-items:center;gap:12px}
.timer .t{font-variant-numeric:tabular-nums;font-size:28px;font-family:var(--display);color:var(--ember);min-width:3ch}
.thread{display:flex;flex-direction:column;gap:8px}
.msg{max-width:88%;padding:10px 13px;font-size:calc(16px*var(--ts));border-radius:16px;background:var(--them);white-space:pre-wrap;overflow-wrap:anywhere}
.msg.mine{align-self:flex-end;background:var(--me)}
.msg small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.msg .pickline{font-weight:700;color:var(--ember)}
.fu{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border:1px dashed #ffb08a66;border-radius:14px}
.fu .kind{align-self:flex-start}
.fu .follow{margin:0}
.levelup{align-self:center;font-size:13px;letter-spacing:.06em;color:var(--ember);background:#ffb08a1a;border:1px solid #ffb08a40;padding:6px 14px;border-radius:999px;text-align:center}
.fb{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.heat{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.heat button{font-size:22px;padding:8px 0;border-radius:12px}
.reacts button.pick{border-color:var(--rose);background:#ff5b7a2b}
.rxw{display:flex;gap:8px}.rxw input{flex:1;min-width:0}.rxw button{flex:none}
.fblines{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}.fblines b{color:var(--ink)}.fblines i{color:var(--ink)}
.heatsum{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:#ff5b7a14;font-size:14px}.big2{font-size:34px;line-height:1}
.cd.word{font-size:52px;font-style:italic}
.cd{font-family:var(--display);font-size:96px;line-height:1;text-align:center;color:var(--rose);font-variant-numeric:tabular-nums;padding-block:8px}
.invite{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:14px;border:1px dashed #ff5b7a66}
.coderow{display:flex;gap:8px;align-items:center}.coderow code{flex:1;min-width:0;font-size:16px;font-weight:700;padding:10px 12px;border-radius:10px;background:var(--card);color:var(--ember);overflow-wrap:anywhere;user-select:all}
details summary{cursor:pointer}
.thermo{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.thermo button{border-radius:8px;padding:10px 2px;font-size:12px;font-weight:600;border:0;color:#200813}
.thermo .t1{background:#f3c6b1}.thermo .t2{background:#f7a98e}.thermo .t3{background:#ff8a7a}.thermo .t4{background:#ff5b7a}.thermo .t5{background:#e8204f;color:#fff}
.h1{color:#f7a98e}.h2{color:#f7a98e}.h3{color:#ff8a7a}.h4{color:#ff5b7a}.h5{color:#ff3d6b}
.reacts{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.reacts button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:14px;font-size:11px;font-weight:600;color:var(--muted)}
.reacts button b{font-size:24px;line-height:1}
.rxchip{align-self:flex-start;border-radius:999px;padding:7px 14px;background:#ff5b7a26;border-color:#ff5b7a66;font-size:14px}
.tbar{flex:1;height:10px;border-radius:5px;background:var(--line);overflow:hidden}.tbar i{display:block;height:100%;background:linear-gradient(90deg,#f3c6b1,#ff5b7a,#e8204f)}
.heatsum{gap:12px}
.talk{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.quote{font-size:13px;color:var(--muted);border-left:3px solid var(--rose);padding-left:8px;margin-bottom:4px}
.msgact{display:flex;gap:6px;margin-top:6px}.msgact button{padding:3px 10px;font-size:12px;background:transparent;border-color:#ffffff22;color:var(--muted)}.msgact button.on{color:var(--rose)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}.chips button{flex:none;padding:7px 12px;font-size:13px;font-weight:500}
.replying{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted);background:#ff5b7a14;padding:6px 10px;border-radius:10px}
.replying span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.replying button{padding:2px 10px}
.readyrow{display:flex;flex-direction:column;gap:8px}
.tsrow{display:flex;gap:8px;align-items:center}.tsrow .lbl{flex:1}
.fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.fxphrase{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);width:min(86vw,440px);text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;
  font-family:var(--display);font-weight:700;font-size:22px;line-height:1.3;color:#fff;background:#160a11eb;border:1px solid #ff5b7a66;border-radius:22px;padding:18px 20px 20px;box-shadow:0 20px 60px -10px #000;animation:fxin 2.5s ease forwards}
.fxphrase b{font-size:56px;line-height:1}
.fx:not(:empty)::before{content:"";position:absolute;inset:0;background:#0b0408a6}
@keyframes fxin{0%{opacity:0;transform:translate(-50%,-40%) scale(.85)}15%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-56%)}}
.fx.fx-hot{background:linear-gradient(0deg,#ff5a1fcc,#ff2d5566 35%,transparent 75%);animation:fxfade 2.5s ease forwards}
.fx.fx-naughty{background:#5a1a8a55;animation:flick 2.5s steps(1) forwards}
.fx.fx-wet{background:linear-gradient(180deg,#5ab4ff33,#1e3a8a44);animation:fxfade 2.5s ease forwards}
.fx.fx-want{background:radial-gradient(circle at 50% 45%,#ff5b7a55,transparent 60%);animation:fxfade 2.5s ease forwards}
.fx.fx-shy{background:radial-gradient(circle at 50% 50%,#ff9ab066,#ff9ab022 45%,transparent 75%);animation:fxfade 2.5s ease forwards}
.fx.fx-sweet{background:#ff2d5533;animation:beat 1.2s ease 2}
@keyframes fxfade{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}
@keyframes flick{0%,20%,40%{opacity:1}10%,30%{opacity:.3}60%{opacity:.8}100%{opacity:0}}
@keyframes beat{0%,100%{opacity:0}15%{opacity:1}30%{opacity:.2}45%{opacity:.9}70%{opacity:.1}}
.fx .pt{position:absolute;bottom:-40px;font-style:normal;animation:rise 2.2s ease-in forwards}
.fx.fx-wet .pt{top:-30px;bottom:auto;width:3px;height:26px;border-radius:3px;background:linear-gradient(#bfe3ff00,#bfe3ff);animation:fall 1.4s linear forwards}
.fx.fx-want .pt{left:50%!important;bottom:auto;top:30%;font-size:140px!important;transform:translateX(-50%);animation:stamp 2.4s ease forwards}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-105vh) rotate(20deg);opacity:0}}
@keyframes fall{0%{transform:translateY(0);opacity:0}10%{opacity:1}100%{transform:translateY(110vh);opacity:.2}}
@keyframes stamp{0%{transform:translateX(-50%) scale(2.2);opacity:0}20%{transform:translateX(-50%) scale(1);opacity:.9}80%{opacity:.9}100%{opacity:0}}
.wrap.shake{animation:shake .5s ease}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-6px,2px) rotate(-.6deg)}40%{transform:translate(6px,-2px) rotate(.6deg)}60%{transform:translate(-4px,1px)}80%{transform:translate(3px,-1px)}}
.wrap.shy{animation:shy 1.2s ease}@keyframes shy{0%,100%{transform:none}30%,70%{transform:scale(.96)}}
@media (prefers-reduced-motion:reduce){.fx,.fxphrase,.wrap.shake,.wrap.shy{animation-duration:.01s!important}.fxphrase{animation:fxfade 2.5s linear forwards!important}}
.result{font-weight:700;font-size:17px;text-align:center}
.result.hit{color:var(--ok)}.result.miss{color:var(--ember)}
.wait{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.dots{display:inline-flex;gap:3px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--rose);animation:b 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.25}30%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.7}}
.stack{display:flex;flex-direction:column;gap:8px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:linear-gradient(transparent,var(--bg) 35%);padding:22px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar .in{max-width:560px;margin:0 auto;display:flex;gap:8px}
.bar button{flex:1}
.big{font-family:var(--display);font-weight:700;font-size:28px;margin:0;line-height:1.1;text-wrap:balance}
.handoff{text-align:center;align-items:center;padding-block:40px}
.scene{margin:-22px -20px 0;height:clamp(140px,40vw,200px);border-radius:24px 24px 0 0;overflow:hidden;position:relative;transition:opacity .4s ease,filter .4s ease;--sc1:#4a1c2c;--sc2:#14070d}
.scene svg{display:block;width:100%;height:100%}
.scene::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,#1d0c17 100%);pointer-events:none}
.card:focus-within .scene{opacity:.35;filter:blur(1px)}
body[data-lv="1"] .scene{--sc1:#4a2a3c;--sc2:#160c18}
body[data-lv="2"] .scene{--sc1:#5a2236;--sc2:#1a0a12}
body[data-lv="3"] .scene{--sc1:#6a1e30;--sc2:#1c080e}
body[data-lv="4"] .scene{--sc1:#7a1a2a;--sc2:#1e060b}
body[data-lv="5"] .scene{--sc1:#86142a;--sc2:#200508}
body[data-lv="f"] .scene{--sc1:#4a2a34;--sc2:#160c12}
@keyframes sc-flick{0%,100%{opacity:1;transform:scaleY(1)}30%{opacity:.85;transform:scaleY(.92) skewX(2deg)}60%{opacity:1;transform:scaleY(1.05) skewX(-2deg)}}
@keyframes sc-sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
@keyframes sc-turn{from{transform:skewX(-2deg)}to{transform:skewX(2deg)}}
@keyframes sc-near-l{0%,15%{transform:translateX(0)}70%,100%{transform:translateX(11px)}}
@keyframes sc-near-r{0%,15%{transform:translateX(0)}70%,100%{transform:translateX(-11px)}}
@keyframes sc-zip{from{transform:scaleY(.08)}to{transform:scaleY(1)}}
@keyframes sc-pull{from{transform:translateY(0)}to{transform:translateY(112px)}}
@keyframes sc-pop{0%,40%{opacity:1}60%,100%{opacity:0}}
@keyframes sc-tug{from{transform:translate(0,0)}to{transform:translate(-4px,2px)}}
@keyframes sc-slide{0%{transform:translateX(0);opacity:0}15%{opacity:1}75%{transform:translateX(-96px);opacity:1}100%{transform:translateX(-110px);opacity:1}}
@keyframes sc-cut{0%,78%{opacity:0}90%,100%{opacity:1}}
@keyframes sc-write{0%,10%{transform:translateX(0)}70%,100%{transform:translateX(200px)}}
@keyframes sc-press{from{transform:translateX(0)}to{transform:translateX(-5px)}}
@keyframes sc-drag{0%{transform:translateY(0);opacity:0}12%{opacity:1}100%{transform:translateY(46px);opacity:.85}}
@keyframes sc-join{0%,35%{opacity:0;transform:translateY(-6px)}55%,100%{opacity:1;transform:translateY(20px)}}
@keyframes sc-appear{0%{opacity:0;transform:translateY(-6px)}12%,85%{opacity:1;transform:none}100%{opacity:0}}
@keyframes sc-rock{from{transform:translateX(-3px)}to{transform:translateX(3px)}}
@keyframes sc-tremble{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
@keyframes sc-pull2{from{transform:scale(1)}to{transform:scale(.9)}}
@keyframes sc-clench{from{transform:scale(1)}to{transform:scale(.95)}}
@keyframes sc-ride{from{transform:translateY(0)}to{transform:translateY(-6px)}}
@keyframes sc-carrock{from{transform:rotate(-.6deg)}to{transform:rotate(.6deg)}}
@keyframes sc-curl{from{transform:rotate(0)}to{transform:rotate(-14deg)}}
@keyframes sc-flutter{from{transform:rotate(-4deg)}to{transform:rotate(5deg)}}
@keyframes sc-breath{from{stroke-dashoffset:28;opacity:.9}to{stroke-dashoffset:0;opacity:.2}}
@keyframes sc-shiver{0%{opacity:0}30%{opacity:.9}100%{opacity:0;transform:translateX(4px)}}
@keyframes sc-sun{from{transform:translateY(8px)}to{transform:translateY(-10px)}}
@keyframes sc-curtain{from{transform:skewX(-2deg)}to{transform:skewX(2.5deg)}}
@keyframes sc-steam{0%{opacity:0;transform:translateY(0)}30%{opacity:.7}100%{opacity:0;transform:translateY(-16px)}}
@keyframes sc-smoke{0%{opacity:0;transform:translateY(0)}25%{opacity:.6}100%{opacity:0;transform:translateY(-50px) translateX(6px)}}
@media (prefers-reduced-motion:reduce){.scene *{animation:none!important}}

.vig{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(130% 90% at 50% 40%,transparent 45%,#000 100%);opacity:var(--vig,0);transition:opacity 2s ease}
.wrap{position:relative;z-index:1}
body{--glowc:#3a1328;--vig:0}

body[data-lv="4"]{--glowc:#6a0f20;--vig:.6} body[data-lv="5"]{--glowc:#7a0b1a;--vig:.72} body[data-lv="f"]{--glowc:#3a1f2a;--vig:.25}
.card{position:relative}
.card.flip{animation:cflip 1.3s ease both;animation-delay:var(--fd,0s)}
.card.flip::before{content:"After Dark";position:absolute;inset:-1px;z-index:4;border-radius:24px;display:grid;place-items:center;font-family:var(--display);font-style:italic;font-weight:700;font-size:34px;color:var(--rose);
  background:radial-gradient(circle at 50% 50%,#3a1328,transparent 70%),repeating-linear-gradient(45deg,#2d1424 0 10px,#24101c 10px 20px);border:1px solid var(--line);animation:cback 1.3s linear both;animation-delay:var(--fd,0s)}
@keyframes cflip{0%,35%{transform:perspective(1000px) rotateY(0)}50%{transform:perspective(1000px) rotateY(90deg)}50.01%{transform:perspective(1000px) rotateY(-90deg)}68%,100%{transform:perspective(1000px) rotateY(0)}}
@keyframes cback{0%,49.9%{opacity:1}50%,100%{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){.card.flip{animation:none}.card.flip::before{display:none}}
.card.gold{border-color:#e8b75a;box-shadow:0 0 0 1px #e8b75a55,0 30px 60px -30px #000,0 0 40px -10px #e8b75a66}
.kind.gold{background:linear-gradient(135deg,#e8b75a33,#ffdf9a22);color:#f3cf7a}
.tease{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:14px;background:#ff5b7a12;border:1px dashed #ff5b7a55}
.tease p{margin:0;font-family:var(--display);font-weight:600;font-size:calc(19px*var(--ts));line-height:1.35}
.tease .blur{filter:blur(6px);user-select:none}
.best{display:flex;flex-direction:column;gap:10px}
.best .msg{opacity:0;animation:bestin .8s ease forwards;max-width:100%}

function makeRoom(){
  const cfg=window.FIREBASE_CONFIG||{};
  if(!window.firebase||!cfg.databaseURL||/PASTE/.test(cfg.databaseURL)) return null;
  if(!firebase.apps.length) firebase.initializeApp(cfg);
  const db=firebase.database(), myPeer="p"+Math.random().toString(36).slice(2,10);
  return { join: async (name)=>{
    const base=db.ref("rooms/"+name+"/peers"), me=base.child(myPeer);
    let obj={}, list=[], hs=[], timer=null;
    const write=()=>me.set({j:JSON.stringify(obj),t:firebase.database.ServerValue.TIMESTAMP});
    await Promise.race([write(), new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),10000))]);
    await me.onDisconnect().remove();
    const conn=db.ref(".info/connected"), onConn=s=>{ if(s.val()===true){ me.onDisconnect().remove(); write().catch(()=>{}); } };
    conn.on("value",onConn);
    const onVal=snap=>{ const v=snap.val()||{};
      list=Object.keys(v).map(k=>{ let pr={}; try{pr=JSON.parse(v[k].j||"{}")}catch(e){}
        return Object.freeze({peer:k,presence:pr,sameTab:k===myPeer,isMe:k===myPeer,by:null,kind:"viewer",guest:false,updatedAt:v[k].t||0}); });
      hs.forEach(h=>h({peers:list})); };
    base.on("value",onVal);
    return { name,
      presence: async (patch)=>{ for(const k in patch){ if(patch[k]===null) delete obj[k]; else obj[k]=patch[k]; }
        clearTimeout(timer); timer=setTimeout(()=>write().catch(()=>{}),50); },
      peers: ()=>list,
      onPeers: h=>{ hs.push(h); setTimeout(()=>h({peers:list}),0); return ()=>{ hs=hs.filter(x=>x!==h); }; },
      leave: async ()=>{ base.off("value",onVal); conn.off("value",onConn); try{ await me.onDisconnect().cancel(); await me.remove(); }catch(e){} } };
  }};
}

 [/neck|\bear\b|whisper|breath/,["breath"]],[/kiss|lips|mouth/,["lean","lipstick","breath"]],[/\btie\b|tied|blindfold|restrain|hold (them|you|me|her|his|him)? ?down/,["blindfold"]],

function pickScene(c,L,last){
  if(L<1) return "";
  const txt=strip(c&&c.x||"").toLowerCase(), ok=id=>SC[id]&&SC[id].l<=Math.min(L,5)&&id!==last;
  for(const [re,ids] of SC_KEY) if(re.test(txt)){ const m=ids.filter(ok); if(m.length) return m[Math.floor(Math.random()*m.length)]; }
  const pool=Object.keys(SC).filter(id=>ok(id)&&(SC[id].l===Math.min(L,5)||(SC[id].l===Math.min(L,5)-1&&Math.random()<.35)));
  return pool[Math.floor(Math.random()*pool.length)]||"";
}

function tok(s,ow){const a=G.pl[ow],b=G.pl[1-ow];

  return s.replace(/{A's}/g,esc(po(a.n))).replace(/{B's}/g,esc(po(b.n))).replace(/{A}/g,esc(a.n)).replace(/{B}/g,esc(b.n))
   .replace(/{ap}/g,g(a)).replace(/{bp}/g,g(b)).replace(/{ac}/g,ch(a)).replace(/{bc}/g,ch(b)).replace(/{aw}/g,w(a)).replace(/{bw}/g,w(b));}

/* ---------- shared-state plumbing ---------- */
function better(x,y){ if(!y)return true; if(x.v!==y.v)return x.v>y.v; return String(x.by)>String(y.by); }
function valid(g){ return g&&typeof g.v==="number"&&Array.isArray(g.pl)&&g.pl.length===2&&g.pl.some(p=>p.id===myId); }

}
function setMine(patch){

function setFor(id,patch){ if(mode==="net"){ if(id===myId) setMine(patch); return; } P[id]=Object.assign({},P[id]||{},patch); render(); }
function onPeers(){
  const seen={};
  for(const p of nr.peers()){ const pr=p.presence||{}; const id=pr.me&&pr.me.id; if(!id)continue;
    if(id===myId&&!p.sameTab)continue; seen[id]=1; P[id]=pr;
    if(pr.g&&valid(pr.g)&&better(pr.g,G)){ G=pr.g; } }
  P[myId]=Object.assign({},mine);
  for(const id in P) if(!seen[id]&&id!==myId) delete P[id];
  if(G&&(!mine.g||mine.g.v!==G.v||mine.g.by!==G.by)){ mine.g=G; nr.presence({g:G}).catch(()=>{}); }
  render();
}

/* ---------- game rules ---------- */
function draw(g,extra){
  g=Object.assign({},g,extra||{});
  const L=g.lvl, prevW=g.c&&g.c!=="fin"&&g.ph==="card"&&card(g.c).t==="w", note=(extra&&extra.note)||"";
  const k0=(g.v||0)+1+"-"+Math.random().toString(36).slice(2,6);
  g.sg=(g.sg||0)+1;
  if(L>=1&&g.sg>=7&&!prevW&&g.c!=="cb"&&g.c!=="sh"&&Math.random()<0.35){ const sh=secretShare(g); if(sh){ g.sg=0; return Object.assign(g,sh,{ph:"card",c:"sh",k:k0,md:"solo",sec:0,ru:"",note,sc:pickScene(null,L,g.sc)}); } }
  const openH=(g.hl||[]).map((m,i)=>[m,i]).filter(([m])=>!m[2]);
  if(L>=1&&openH.length&&g.c!=="cb"&&!prevW&&Math.random()<0.3){
    const [m,mi]=openH[Math.floor(Math.random()*openH.length)];
    const cx="Earlier you said “"+esc(m[1])+"” and {B} loved it ❤️. Take it further.";
    const hl=g.hl.map((x,j)=>j===mi?[x[0],x[1],1]:x);
    return Object.assign(g,{ph:"card",c:"cb",cx,k:k0,ow:m[0],md:"solo",sec:0,ru:"",hl,note,sc:pickScene(null,L,g.sc)});
  }
  const openMem=(g.mem||[]).map((m,i)=>[m,i]).filter(([m])=>!m[3]);
  if(L>=2&&openMem.length&&g.c!=="cb"&&!prevW&&Math.random()<0.25){
    const [m,mi]=openMem[Math.floor(Math.random()*openMem.length)], self=Math.random()<.5, src=card(m[1]);
    const qx=strip(tok(src.x,m[0])), ans=strip(tok(src.t==="f"?src.o[m[2]][0]:src.o[m[2]],m[0]));
    const list=self?CB.self:CB.other, cx=list[Math.floor(Math.random()*list.length)].replace("{q}",qx).replace("{ans}",ans);
    const mem=g.mem.map((x,j)=>j===mi?[x[0],x[1],x[2],1]:x);
    return Object.assign(g,{ph:"card",c:"cb",cx,k:k0,ow:self?m[0]:1-m[0],md:"solo",sec:0,ru:"",mem,note,sc:pickScene(null,L,g.sc)});
  }
  let used=(g.u&&g.u[L]?g.u[L].split(",").filter(Boolean).map(Number):[]);
  let left=D[L].map((c,i)=>i).filter(i=>!used.includes(i)&&!(prevW&&D[L][i].t==="w"));
  if(!left.length){used=[];left=D[L].map((c,i)=>i).filter(i=>!(prevW&&D[L][i].t==="w"));}
  const win=left.slice(0,4), i=win[Math.floor(Math.random()*win.length)], c=D[L][i];
  used.push(i);
  const pend=Object.assign({},g.pend||{});
  let ow=g.nt, md="solo", sec=c.s||0, ru="";
  if(c.t!=="w"){
    if(pend.swap){ow=1-g.nt;delete pend.swap;}
    if(c.g) md="guess"; else if(c.t==="r"||c.t==="e"||c.m==="reply") md="reply";
    if(pend.both&&md==="solo"&&c.w!=="b"){md="both";delete pend.both;}
    if(pend.rule){ru=pend.rule;delete pend.rule;}
    if(sec&&pend.dbl){sec*=2;delete pend.dbl;}
  }
  const k=k0;
  return Object.assign(g,{ph:"card",c:L+":"+i,k,ow,md,sec,ru,pend,note,sc:c.t==="w"?"":pickScene(c,L,g.sc),u:Object.assign({},g.u,{[L]:used.join(",")})});
}
function secretShare(g){
  const src=[], q=t=>esc(String(t).replace(/[.\s]+$/,""));
  (g.bl||[]).forEach(m=>src.push(()=>({ow:m[0],cx:"{B} hearted your line “"+q(m[1])+"”. Share what you held back when you wrote it."})));
  (g.tx||[]).forEach(m=>{ src.push(()=>({ow:m[0],cx:"You wrote “"+q(m[1])+"”. Share the part you left out."}));
    src.push(()=>({ow:1-m[0],cx:"{B} wrote “"+q(m[1])+"” earlier. Tell {B} exactly what it did to you when you read it."})); });
  (g.mem||[]).forEach(m=>{ const c=D[m[1].split(":")[0]]&&card(m[1]); if(!c||!c.o)return; const ans=strip(tok(c.t==="f"?c.o[m[2]][0]:c.o[m[2]],m[0]));
    src.push(()=>({ow:m[0],cx:"Earlier you picked “"+q(ans)+"”. Tell {B} the one detail you pictured but didn't say."})); });
  if(!src.length) return null;
  return src[Math.floor(Math.random()*src.length)]();
}
function collectHearts(g){ if(!G||!G.k)return; const th=thread(); const bl=(g.bl||[]).slice();
  th.forEach(m=>{ if(hearted(m.a+":"+m.i)){ const t=m.t.slice(0,90); if(!bl.some(x=>x[1]===t)) bl.push([G.pl.findIndex(p=>p.id===m.a),t]); } }); g.bl=bl.slice(-8); }
function startGame(players,cap){
  const base={v:G?G.v:0,ph:"card",pl:players,cap,lvl:0,n:0,mem:[],ht:[0,0],nt:Math.random()<.5?0:1,u:{},pend:{}};
  commit(draw(base));
}
function nextCard(skipped){
  const c=card(G.c), g=Object.assign({},G);
  if(mode==="net"&&c.t!=="w") collectHearts(g);
  if(!skipped&&G.lvl>=1&&G.ph==="card"&&c.t!=="w"&&(G.md==="solo"||G.md==="both")){ const own=G.pl[G.ow].id, ids=G.md==="both"?[own,other(own)]:[c.w==="b"?other(own):own];
    ids.forEach(id=>{ const a=A(id), t=a&&((a.t&&a.t[0])||a.f); if(t&&t.length>=8&&t!=="(ran out of time)") g.tx=(g.tx||[]).concat([[G.pl.findIndex(p=>p.id===id),t.slice(0,80)]]).slice(-5); }); }
  if(G.ph==="fin"){ const seq=(G.ws||"f").split(","), wi=(G.wi||0)+1; if(wi>=seq.length) return commit({ph:"end",k:G.k+"e",bl:g.bl}); return commit(Object.assign(wdCard(seq[wi],wi),{bl:g.bl})); }
  if(!skipped&&G.lvl>=1&&(c.t==="q"||c.t==="f")&&G.md==="solo"&&!c.g){ const a=A(G.pl[G.ow].id); if(a&&a.o!=null) g.mem=(g.mem||[]).concat([[G.ow,G.c,a.o,0]]).slice(-10); }
  if(c.t!=="w"&&G.lvl>=1){ const th=thread(); const hl=(g.hl||[]).slice();
    th.forEach(m=>{ if(hearted(m.a+":"+m.i)) hl.push([G.pl.findIndex(p=>p.id===m.a),m.t.slice(0,100),0]); }); g.hl=hl.slice(-8); }
  if(c.t!=="w"){ const rts=G.pl.map(p=>P[p.id]&&P[p.id].rt&&P[p.id].rt.k===G.k?P[p.id].rt.v:0).filter(Boolean); const h=g.ht||[0,0]; g.ht=[h[0]+rts.reduce((x,y)=>x+y,0),h[1]+rts.length]; }
  if(c.t==="w"&&!skipped){
    const pend=Object.assign({},g.pend);
    if(c.fx==="both")pend.both=1; if(c.fx==="swap")pend.swap=1; if(c.fx==="dbl")pend.dbl=1;
    if(c.fx==="rule"){const a=A(G.pl[1-G.ow].id); if(a&&a.t&&a.t[0])pend.rule=a.t[0].slice(0,200);}
    g.pend=pend; return commit(draw(g));
  }
  if(c.t!=="w"){ g.n=(g.n||0)+1; g.nt=1-g.nt; }
  if(g.lvl===0&&g.n>=PER(0)){ return commit(draw(g,{lvl:1,n:0,ht:[0,0],note:"Warm-up done. Level 1 · Spark starts now."})); }
  if(g.n>=PER(g.lvl)){ return commit(Object.assign(g,{ph:"check",k:"c"+g.v+Math.random().toString(36).slice(2,5)})); }
  commit(draw(g));
}
const FIN_SC=["morning","hisshirt","smoke"];
function wdCard(s,wi){ return {ph:"fin",c:s==="f"?"fin":"wd:"+s,k:"f"+G.v+"-"+wi,md:"both",ow:G.nt||0,sec:0,ru:"",wi,note:"",sc:FIN_SC[(wi+(G.ws||"").length)%3]}; }
function windDown(){ const idx=[0,1,2,3,4].sort(()=>Math.random()-.5).slice(0,2); commit(Object.assign({ws:idx.concat(["f"]).join(",")},wdCard(String(idx[0]),0))); }

/* What input is needed right now, and from whom */
function needs(){
  if(!G)return{ids:[],secret:false};
  if(G.ph==="check"||G.ph==="pause"||(G.ph==="climax"&&!G.cts)){ return {ids:G.pl.map(p=>p.id).filter(id=>!(P[id]&&P[id].vt&&P[id].vt.k===G.k)),secret:false,vote:true}; }
  if(G.ph!=="card"&&G.ph!=="fin")return{ids:[],secret:false};
  const c=card(G.c), own=G.pl[G.ow].id, oth=other(own), done=id=>{const a=A(id);return a&&a.d};
  if(c.t==="w") return c.fx==="rule"&&!done(oth)?{ids:[oth],secret:false}:{ids:[],secret:false};
  if(G.md==="solo"){const act=c.w==="b"?oth:own; return {ids:done(act)?[]:[act],secret:false};}
  if(G.md==="both"||G.md==="guess"){ return {ids:[own,oth].filter(id=>!done(id)),secret:true}; }
  if(G.md==="reply"){ const first=c.w==="b"?oth:own, sec=other(first), n=c.n||3;
    const f=(A(first)&&A(first).t||[]).length, s=(A(sec)&&A(sec).t||[]).length;
    if(f>=n&&s>=n)return{ids:[],secret:false};
    return {ids:[f>s?sec:first],secret:false}; }
  return{ids:[],secret:false};
}
function complete(){
  if(!G||(G.ph!=="card"&&G.ph!=="fin"))return false;
  const c=card(G.c);
  if(c.t==="w"&&c.fx!=="rule")return true;
  if(G.md==="reply"){const first=c.w==="b"?other(G.pl[G.ow].id):G.pl[G.ow].id,sec=other(first);
    return ((A(first)&&A(first).t)||[]).length>=1&&((A(sec)&&A(sec).t)||[]).length>=1;}
  if(needs().ids.length)return false;
  if(c.t==="q"&&c.fu&&(G.md==="solo"||G.md==="guess")){const a=A(G.pl[G.ow].id); if(!(a&&(a.f||a.fp)))return false;}
  return true;
}
/* Both votes in -> resolve (done by whichever device sees it first; ties settle on the shared version) */
function autoResolve(){
  if(!G||!["check","pause","climax"].includes(G.ph)||(G.ph==="climax"&&G.cts))return;
  const vs=G.pl.map(p=>P[p.id]&&P[p.id].vt&&P[p.id].vt.k===G.k?P[p.id].vt.c:null);
  if(vs.includes(null))return;
  if(G.ph==="pause"){ commit({ph:G.pp.ph,k:G.pp.k}); return; }
  if(G.ph==="climax"){ if(vs.includes("skip"))return windDown(); return commit({cts:Date.now()+2500}); }
  if(vs.includes("end"))return finale();
  let lvl=G.lvl; if(vs.includes("down"))lvl=Math.max(1,lvl-1); else if(vs.every(v=>v==="up"))lvl=Math.min(G.cap,lvl+1);
  const note=lvl>G.lvl?`Level ${lvl} · ${LVN(lvl)}. Hotter from here.`:lvl<G.lvl?`Cooled down to ${LVN(lvl)}.`:`Staying at ${LVN(lvl)} for another round.`;
  const g=Object.assign({},G,{lvl,n:0,ht:[0,0]}); commit(draw(g,{note}));
}

  if(mode==="net")return myId;

    if(c.t==="e"&&id===G.pl[G.ow].id&&/[\p{L}\p{N}]/u.test(t)){ emojiErr=true; lastSig=""; return; }

function sig(){ const strip={}; for(const id in P){const p=P[id];strip[id]={me:p.me,a:p.a,vt:p.vt,rx:p.rx,rt:p.rt,cm:p.cm,hv:p.hv,rd:p.rd,ty:id===myId?null:p.ty};}
  return JSON.stringify([mode,joined,G,strip,holder,flash,form.code,emojiErr,invite,copied,rxOpen,replyTo]); }

  return `<article class="card">${sceneSvg("morning")}<p class="big">Good night, ${esc(G.pl[0].n)} &amp; ${esc(G.pl[1].n)}</p>${best}
   <button class="primary" id="again">Play again</button></article>`;
}
function bar(){
  const b=$("#bar"); const on=G&&G.ph!=="lobby"&&G.ph!=="end";
  b.hidden=!on; if(!on)return;
  const canSkip=G.ph==="card"||G.ph==="fin"||(G.ph==="climax");
  $("#barin").innerHTML=`${canSkip?`<button class="ghost" id="skip">Skip</button>`:""}<button class="ghost" id="pause" ${G.ph==="pause"?"disabled":""}>Pause</button>`;
  const on2=(id,f)=>{const e=$(id);if(e)e.onclick=f;};
  on2("#skip",()=>{holder=null; if(G.ph==="climax")windDown(); else nextCard(true)}); on2("#pause",pause);
  on2("#newg2",()=>{ if(confirmNew){confirmNew=false;commit({ph:"lobby"});} else {confirmNew=true;$("#newg2").textContent="Tap again to restart";setTimeout(()=>{confirmNew=false;const e=$("#newg2");if(e)e.textContent="New game"},3000);} });
}
let confirmNew=false;
function bind(){
  const on=(id,f)=>{const e=$(id);if(e)e.onclick=f;};
  const rd=()=>{form.n=($("#fn")||{}).value?.trim()??form.n;form.b=($("#fb")||{}).value||form.b;form.cap=($("#fc")||{}).value||form.cap;
    if($("#fr"))form.code=$("#fr").value.trim(); if($("#fn2"))form.n2=$("#fn2").value.trim(); if($("#fb2"))form.b2=$("#fb2").value; if($("#fc2"))form.cap2=$("#fc2").value; saveForm();};
  document.querySelectorAll("#app input,#app select").forEach(e=>e.onchange=rd);
  on("#join",()=>{ rd(); const cd=form.code.toLowerCase().trim().replace(/[^a-z0-9-]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40);
    if(!okCode(cd)){flash="Type the room word your partner sent you.";lastSig="";return render();} joinRoom(cd); });
  on("#create",()=>{ rd(); if(!form.n){flash="Add your name first.";lastSig="";return render();} if(!form.b){flash="Choose Girl or Boy.";lastSig="";return render();} joinRoom(newCode()); });
  on("#joininv",()=>{ rd(); joinRoom(invite); });
  on("#notinv",()=>{ invite=""; setHash(""); try{history.replaceState(null,"",location.pathname+location.search)}catch(e){} flash=""; lastSig=""; render(); });
  on("#copylink",()=>copyText(inviteURL(),"link"));
  on("#sharelink",()=>{ const url=inviteURL(); if(navigator.share){ navigator.share({title:"After Dark",text:"Join me 😏",url}).catch(()=>{}); } else copyText(url,"link"); });
  on("#copymsg",()=>copyText(`Come play After Dark with me 😏 Open the game link and join room: ${code}`,"msg"));
  on("#tolocal",()=>{mode="local";flash="";G=null;lastSig="";render();});
  on("#tonet",()=>{mode="net";flash="";G=null;lastSig="";render();});
  on("#leave",async()=>{ try{await nr.leave()}catch(e){} nr=null;joined=false;G=null;invite="";for(const k in P)delete P[k];mine={};lastSig="";render(); });
  on("#nstart",()=>{ const ids=Object.keys(P).filter(id=>P[id]&&P[id].me).sort().slice(0,2); if(!ids.includes(myId)){ids[1]=myId;ids.sort();}
    const pls=ids.map(id=>({id,n:P[id].me.n,b:P[id].me.b})); const cap=Math.min(...ids.map(id=>+P[id].me.cap||5));
    startGame(pls,cap); });
  on("#lstart",()=>{ rd(); if(!form.n||!form.n2||!form.b){flash="Add both names and choose Girl or Boy.";lastSig="";return render();}
    for(const k in P)delete P[k]; holder=null; G=null;
    startGame([{id:"p0",n:form.n.slice(0,16),b:form.b},{id:"p1",n:form.n2.slice(0,16),b:form.b2}],Math.min(+form.cap,+form.cap2)); });
  on("#take",()=>{ holder=needs().ids[0]; lastSig=""; render(); });
  document.querySelectorAll("#app .opts button").forEach(b=>b.onclick=()=>{ const t=$("#ans"); if(t)draft=t.value; sel=+b.dataset.o; lastSig=""; render(); });
  on("#send",()=>{ sendText(); if(mode==="local"){ const nd=needs(); if(!nd.secret&&nd.ids.length)holder=nd.ids[0]; } lastSig=""; render(); });
  on("#tstart",startTimer);
  on("#fusend",()=>{ const t=($("#ans")&&$("#ans").value||"").trim(); if(!t)return; const own=G.pl[G.ow].id; setFor(own,{a:Object.assign({},A(own),{f:t.slice(0,400)}),ty:null}); draft=""; lastSig=""; render(); });
  on("#fupass",()=>{ const own=G.pl[G.ow].id; setFor(own,{a:Object.assign({},A(own),{fp:1}),ty:null}); draft=""; lastSig=""; render(); });
  on("#whysend",()=>{ const t=($("#ans")&&$("#ans").value||"").trim(); if(!t)return; const own=G.pl[G.ow].id; setFor(own,{a:Object.assign({},A(own),{x:t.slice(0,300)}),ty:null}); draft=""; lastSig=""; render(); });
  const ta=$("#ans"); if(ta){ ta.oninput=()=>{ draft=ta.value; if(mode==="net"){ const want=ta.value?G.k:null; if((mine.ty||null)!==want){ mine.ty=want; nr&&nr.presence({ty:want}).catch(()=>{}); } } }; }
  document.querySelectorAll("#app [data-rx]").forEach(b=>b.onclick=()=>{ rxOpen=false; setFor(b.dataset.who,{rx:{k:G.k,e:b.dataset.rx,ts:Date.now()}}); });
  on("#rxchange",()=>{ rxOpen=true; lastSig=""; render(); });
  document.querySelectorAll("#app [data-rt]").forEach(b=>b.onclick=()=>setFor(b.dataset.who,{rt:{k:G.k,v:+b.dataset.rt}}));
  document.querySelectorAll("#app [data-q]").forEach(b=>b.onclick=()=>{ const i=$("#cmt"); if(!i)return; i.value=QUICK[+b.dataset.q]; cmtDraft=i.value; i.focus(); });
  document.querySelectorAll("#app [data-reply]").forEach(b=>b.onclick=()=>{ const i=$("#cmt"); if(i)cmtDraft=i.value; replyTo=b.dataset.reply; lastSig=""; render(); const n=$("#cmt"); if(n)n.focus(); });
  document.querySelectorAll("#app [data-heart]").forEach(b=>b.onclick=()=>{ const cur=(P[myId]&&P[myId].hv&&P[myId].hv.k===G.k?P[myId].hv.ids:[])||[], id=b.dataset.heart;
    setMine({hv:{k:G.k,ids:cur.includes(id)?cur.filter(x=>x!==id):cur.concat([id]).slice(-10)}}); });
  on("#cmtx",()=>{ replyTo=null; lastSig=""; render(); });
  const sendCmt=()=>{ const i=$("#cmt"); const t=(i&&i.value||"").trim(); if(!t)return;
    const cur=(P[myId]&&P[myId].cm&&P[myId].cm.k===G.k?P[myId].cm.m:[])||[];
    const m={i:cur.length?cur[cur.length-1].i+1:0,t:t.slice(0,200),s:Date.now()}; if(replyTo)m.r=replyTo;
    cmtDraft=""; replyTo=null; if(i)i.value=""; mine.ty=null;
    setMine({cm:{k:G.k,m:cur.concat([m]).slice(-10)},ty:null,rd:null}); };
  on("#cmtsend",sendCmt);
  const ci=$("#cmt"); if(ci){ ci.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); sendCmt(); } };
    ci.oninput=()=>{ cmtDraft=ci.value; if(mode==="net"){ const want=ci.value?"c"+G.k:null; if((mine.ty||null)!==want){ mine.ty=want; nr&&nr.presence({ty:want}).catch(()=>{}); } } }; }
  on("#ready",()=>setMine({rd:{k:G.k}}));
  on("#unready",()=>setMine({rd:null}));
  on("#wdgo",()=>windDown());
  on("#tsm",()=>setTs(-0.1)); on("#tsp",()=>setTs(0.1));
  on("#next",()=>{ holder=null; nextCard(false); });
  document.querySelectorAll("#app [data-v]").forEach(b=>b.onclick=()=>{ vote(b.dataset.v); });
  on("#cool",()=>{ holder=null; coolDown(); }); on("#end",()=>finale());
  on("#again",()=>{ if(mode==="local"){G=null;lastSig="";render();} else commit({ph:"lobby"}); });
  bar();
}
let lastK=null, flipAt=0;
function setTs(d){ let v=+(getComputedStyle(document.documentElement).getPropertyValue("--ts")||1); v=Math.min(1.4,Math.max(0.85,Math.round((v+d)*100)/100));
  document.documentElement.style.setProperty("--ts",v); try{localStorage.setItem("ad-ts",v)}catch(e){} }
try{ const v=localStorage.getItem("ad-ts"); if(v)document.documentElement.style.setProperty("--ts",v); }catch(e){}
function tick(){
  document.querySelectorAll("[data-ts]").forEach(el=>{
    const left=Math.max(0,Math.ceil((+el.dataset.ts+ +el.dataset.sec*1000-Date.now())/1000));
    el.textContent=left;
    if(left<=0&&el.dataset.mine&&!el.dataset.fired){ el.dataset.fired="1"; const t=($("#ans")&&$("#ans").value.trim())||"(ran out of time)";
      const id=actor(); setFor(id,{a:{k:G.k,ts:+el.dataset.ts,t:[t.slice(0,400)],d:1},ty:null}); draft=""; }
  });
}
setInterval(tick,250);
function tickCd(){ document.querySelectorAll("[data-cd]").forEach(el=>{ const st=+el.dataset.cd, now=Date.now();
  if(now<st){el.textContent="Get ready…";el.classList.add("word");return;} const left=10-Math.floor((now-st)/1000);
  if(left>0){el.textContent=left;el.classList.remove("word"); const n=$("#cdn"); if(n)n.textContent=left>3?"Breathe. Not yet…":"Almost… hold it…";}
  else{el.textContent="Now 💦";el.classList.add("word"); const n=$("#cdn"); if(n)n.textContent="Let go. Together."; const b=$("#wdgo"); if(b)b.hidden=false;} }); }
setInterval(tickCd,200);

(async()=>{
  render();
  try{ room=makeRoom(); }catch(e){ room=null; }
  mode=room?"net":"local"; if(!room) flash="Sync isn't set up yet, so this is one-phone mode."; render();
  if(room&&invite&&form.n&&form.b) joinRoom(invite);
})();
window.addEventListener("hashchange",()=>{ if(joined)return; try{const h=decodeURIComponent(location.hash.slice(1)).toLowerCase(); if(okCode(h)&&h!==invite){invite=h;lastSig="";render(); if(room&&form.n&&form.b)joinRoom(h);} }catch(e){} });

</script>
